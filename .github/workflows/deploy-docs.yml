name: Deploy documentation
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-gate:
    name: Docs Build Gate
    runs-on: ${{ github.repository_owner == 'lambdasistemi' && 'nixos' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix before organization transfer
        if: github.repository_owner != 'lambdasistemi'
        uses: paolino/dev-assets/setup-nix@0328b73b71788bb83848fe407dd04136a52c3697
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --accept-flake-config .#docs -o result-docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: result-docs
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build-gate
    runs-on: ${{ github.repository_owner == 'lambdasistemi' && 'nixos' || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
